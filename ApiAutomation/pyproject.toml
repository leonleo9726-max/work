[project]
name = "eastpoint-api-automation"
version = "0.1.0"
description = "EastPoint API automation and batch command tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography==46.0.7",
    "pytest==9.0.3",
    "pytest-html==4.2.0",
    "requests==2.32.5",
]

[dependency-groups]
dev = ["ruff==0.16.2"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
