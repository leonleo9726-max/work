name: offline-tests

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r ApiAutomation/requirements-dev.txt
      - run: python -m ruff check ApiAutomation
      - run: python -m compileall -q ApiAutomation
      - run: pytest ApiAutomation -m "not api"
