name: API Automation Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiAutomation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --collect-only -p no:cacheprovider -o addopts=''
      - run: python -m pytest -m unit -p no:cacheprovider -o addopts=''
